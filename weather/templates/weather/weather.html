<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Django weather dashboard powered by OpenWeather.">
    <title>{{ city }} weather | Weather App</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb); transition: background .4s;
        }
        body.weather-clear { background: linear-gradient(135deg, #f59e0b, #38bdf8); }
        body.weather-clouds { background: linear-gradient(135deg, #64748b, #cbd5e1); }
        body.weather-rain { background: linear-gradient(135deg, #1e3a8a, #0f172a); }
        body.weather-snow { background: linear-gradient(135deg, #e2e8f0, #60a5fa); }
        .card {
            width: min(100%, 460px); padding: 40px; border: 1px solid rgba(255,255,255,.35);
            border-radius: 28px; background: rgba(255,255,255,.9); box-shadow: 0 24px 70px rgba(15,23,42,.3);
            backdrop-filter: blur(16px);
        }
        .eyebrow { margin: 0 0 8px; color: #2563eb; font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 0; color: #0f172a; font-size: clamp(2rem, 8vw, 3.5rem); }
        .temperature { margin: 20px 0 0; color: #0f172a; font-size: 4rem; font-weight: 800; }
        .description { margin: 0 0 28px; color: #475569; font-size: 1.15rem; text-transform: capitalize; }
        form { display: flex; gap: 10px; }
        input, button { min-height: 48px; border-radius: 12px; font: inherit; }
        input { min-width: 0; flex: 1; padding: 0 14px; border: 1px solid #cbd5e1; }
        button { padding: 0 18px; border: 0; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .error { margin: 22px 0; padding: 14px; border-radius: 12px; background: #fee2e2; color: #991b1b; }
        @media (max-width: 460px) { .card { padding: 28px; } form { flex-direction: column; } }
    </style>
</head>
<body class="{% if weather_type %}weather-{{ weather_type }}{% endif %}">
    <main class="card">
        <p class="eyebrow">Live weather</p>
        <h1>{{ city }}</h1>
        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% else %}
            <p class="temperature">{{ temperature|floatformat:1 }}°</p>
            <p class="description">{{ description }}</p>
        {% endif %}
        <form method="get" aria-label="Search weather by city">
            <input type="text" name="city" placeholder="Search a city" value="{{ city }}" aria-label="City" required>
            <button type="submit">Search</button>
        </form>
    </main>
</body>
</html>
